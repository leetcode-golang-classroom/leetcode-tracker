name: Lint solutions

# Format/lint check for solutions changed in a PR. Kept separate from
# verify-solutions.yml on purpose: a lint failure must not flip the Verified
# field on the Project. Unimplemented scaffold stubs (TODO(scaffold)) are skipped.
on:
  pull_request:
    branches: [master]
    paths:
      - "python/**"
      - "javascript/**"
      - "go/**"
      - "java/**"
      - ".github/scripts/java_imports.py"
      - "scripts/lint.sh"
      - ".github/workflows/lint.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }

      - name: Lint changed solutions
        run: scripts/lint.sh
