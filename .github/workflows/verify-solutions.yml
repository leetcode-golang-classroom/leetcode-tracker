name: Verify changed solutions

# Runs the matching language runner for every solution file touched by a
# pull request, then calls record_result.py to write Verified/Runtime/Memory
# back onto the sub-issue + leave a timestamped comment. This replaces running
# record_result.py by hand — opening/updating a PR is enough to update the board.
on:
  pull_request:
    branches: [master]
    paths:
      - "python/**"
      - "javascript/**"
      - "go/**"
      - "rust/**"
      - "java/**"
      - "other/**"
  workflow_dispatch:
    inputs:
      solution_path:
        description: "Path to a single solution file to (re-)verify"
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: dtolnay/rust-toolchain@stable

      - name: Determine changed solution files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            printf '%s\n' "${{ inputs.solution_path }}" > changed_files.txt
          else
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" \
              -- python javascript go rust java other > changed_files.txt
          fi
          cat changed_files.txt

      - name: Verify + record each changed solution
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          GH_REPO: ${{ github.repository }}
          GH_PROJECT_OWNER: ${{ vars.GH_PROJECT_OWNER }}
          GH_PROJECT_NUMBER: ${{ vars.GH_PROJECT_NUMBER }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/run_go.sh .github/scripts/run_rust.sh .github/scripts/run_java.sh

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ -f "$file" ] || { echo "skip (deleted): $file"; continue; }

            if grep -q 'TODO(scaffold)' "$file"; then
              echo "skip (unimplemented scaffold stub): $file"
              continue
            fi

            case "$(basename "$file")" in
              solution.*) ;;
              *) echo "skip (not a solution file): $file"; continue ;;
            esac

            dir="${file%%/*}"
            stem="$(basename "$(dirname "$file")")" # <NNNN>-<slug>
            id="${stem%%-*}"
            slug="${stem#*-}"
            testcases="testcases/${id}-${slug}.json"

            if [ ! -f "$testcases" ]; then
              echo "skip (no testcases at $testcases): $file"
              continue
            fi

            case "$dir" in
              python)     lang=python; cmd=(uv run .github/scripts/run_python.py "$file" "$testcases") ;;
              javascript) lang=javascript-typescript; cmd=(node .github/scripts/run_javascript.mjs "$file" "$testcases") ;;
              go)         lang=go; cmd=(.github/scripts/run_go.sh "$file" "$testcases") ;;
              rust)       lang=rust; cmd=(.github/scripts/run_rust.sh "$file" "$testcases") ;;
              java)       lang=java; cmd=(.github/scripts/run_java.sh "$file" "$testcases") ;;
              other)      echo "skip (no generic runner for other/ yet): $file"; continue ;;
              *)          continue ;;
            esac

            echo "verifying $file ($lang)"
            uv run .github/scripts/record_result.py "$id" "$lang" -- "${cmd[@]}"
          done < changed_files.txt
