name: Seed this week's problems

# problems.yaml is expected to hold several weeks of pre-curated problems in
# advance (each row already tagged with its `week`). This workflow does NOT
# invent problems — it just seeds whichever week is "due" on schedule, so
# nothing new appears if you forget to top up problems.yaml ahead of time.
on:
  schedule:
    - cron: "0 16 * * 0" # Sunday 16:00 UTC = Monday 00:00 Asia/Taipei
  workflow_dispatch: {} # allows a manual catch-up run from the Actions tab

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PROJECT_PAT }} # needed so the scaffold PR can trigger other workflows

      - uses: astral-sh/setup-uv@v3

      - name: Compute current week number
        id: week
        run: |
          start_date="${{ vars.WEEK1_START_DATE }}" # e.g. "2026-09-28", the Monday of week 1
          if [ -z "$start_date" ]; then
            echo "WEEK1_START_DATE repo variable is not set" >&2
            exit 1
          fi
          today_epoch=$(date -u +%s)
          start_epoch=$(date -u -d "$start_date" +%s)
          days=$(( (today_epoch - start_epoch) / 86400 ))
          week=$(( days / 7 + 1 ))
          echo "current week is $week"
          echo "week=$week" >> "$GITHUB_OUTPUT"

      - name: Seed due problems into issues + Project
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }} # classic PAT with `repo` + `project` scopes
          GH_REPO: ${{ github.repository }}
          GH_PROJECT_OWNER: ${{ vars.GH_PROJECT_OWNER }}
          GH_PROJECT_NUMBER: ${{ vars.GH_PROJECT_NUMBER }}
          LANGUAGES: ${{ vars.LANGUAGES }} # e.g. "python" or "python,go"
          MAX_WEEK: ${{ steps.week.outputs.week }}
        run: uv run .github/scripts/seed_problems.py problems.yaml

      # Generate stubs + README + testcases for the due problems and open a PR.
      # Existing files are never overwritten, so re-runs only add what is missing.
      - name: Scaffold starter files
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          LANGUAGES: ${{ vars.LANGUAGES }}
          MAX_WEEK: ${{ steps.week.outputs.week }}
        run: |
          set -euo pipefail
          uv run .github/scripts/scaffold.py problems.yaml
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing to scaffold"
            exit 0
          fi
          branch="scaffold/week-${MAX_WEEK}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add -A
          git commit -m "✨ (scaffold): week ${MAX_WEEK} starter files"
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --base master --head "$branch" \
              --title "✨ (scaffold): week ${MAX_WEEK} starter files" \
              --body "Auto-generated stubs, READMEs and testcases for week ${MAX_WEEK}. Stubs keep a \`TODO(scaffold)\` marker, so CI skips them until you implement and remove it."
          fi
